apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: disallow-latest-tag
spec:
  validationFailureAction: Enforce
  rules:
    - name: pinned-tag
      match: { any: [{ resources: { kinds: [Deployment, StatefulSet] } }] }
      validate:
        message: "Images must be pinned to a tag other than :latest."
        pattern:
          spec: { template: { spec: { containers: [{ image: "*:* & !*:latest" }] } } }
