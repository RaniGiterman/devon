[project]
name = "devon"
version = "0.1.0"
description = "Self-healing Kubernetes agent: detect, diagnose, fix via GitOps PR, verify."
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.32",
  "kubernetes>=31.0",
  "openai>=1.55",
  "httpx>=0.27",
  "python-telegram-bot>=21.6",
  "pyyaml>=6.0",
  "pydantic-settings>=2.6",
]

[project.scripts]
devon-agent = "agent.main:run"
devon-chaos = "chaos.cli:main"

[dependency-groups]
dev = ["pytest>=8.3", "pytest-asyncio>=0.24"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agent", "chaos"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
markers = ["scenario: end-to-end fault scenarios against a live cluster (set DEVON_SCENARIOS=1)"]
